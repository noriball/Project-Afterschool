name: Generate Archive
on:
  workflow_dispatch:
    inputs:
      post:
        description: 'Bluesky に投稿する（トーン確認だけなら false）'
        type: boolean
        default: true
  schedule:
    # JST 7時〜23時に約5時間おきで4回。朝の号は UTC では前日に走るので、日付は必ず JST で採る。
    # 分が 0/15/30/45 だと世界中の cron と競合して数時間遅れるため、半端な分に散らしてある。
    - cron: '11 22 * * *'  # 07:11 JST
    - cron: '29 3 * * *'   # 12:29 JST
    - cron: '47 8 * * *'   # 17:47 JST
    - cron: '23 13 * * *'  # 22:23 JST

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Archive Generator
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archives/
          git commit -m "chore: add generated archive" || echo "No changes to commit"
          git push

      # 投稿の失敗でアーカイブまで巻き添えにしないよう、コミット後に独立させる。
      # クォータ超過で号が生成されなかった時は created が空になり、過去号の再投稿を防ぐ。
      - name: Post to Bluesky
        if: ${{ (github.event_name == 'schedule' || inputs.post) && steps.generate.outputs.created != '' }}
        continue-on-error: true
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python post_to_bluesky.py
